apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-app-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/baongdqu/project-devops-gitops.git
    targetRevision: HEAD
    path: k8s/manifests/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  syncPolicy:
    automated:
      prune: false  # Prod thường tắt auto-prune hoặc yêu cầu manual sync để kiểm soát
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
