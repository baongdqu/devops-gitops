apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: prod

resources:
  - ../../base

namePrefix: prod-

images:
  - name: ghcr.io/baongdqu/project-devops-webserver/backend
    newTag: sha-10cea0d
  - name: ghcr.io/baongdqu/project-devops-webserver/frontend
    newTag: sha-10cea0d

patches:
  - target:
      kind: Deployment
      name: backend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 4
