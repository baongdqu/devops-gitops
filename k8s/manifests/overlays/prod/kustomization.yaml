apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: prod

resources:
  - ../../base

namePrefix: prod-

images:
  - name: ghcr.io/your-username/devops-backend
    newTag: v1.0.0
  - name: ghcr.io/your-username/devops-frontend
    newTag: v1.0.0

patches:
  - target:
      kind: Deployment
      name: backend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 4
