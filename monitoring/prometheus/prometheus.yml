global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert-rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  # 1. Scrape chính Prometheus
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # 2. Scrape Backend Application Metrics
  - job_name: 'devops-backend-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['devops-backend:5000']
